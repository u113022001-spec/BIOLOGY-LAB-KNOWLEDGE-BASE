<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b68">
<title>LLM Wiki｜生物實驗科普</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#edf2f8;--text:#17243a;--muted:#66758b;--line:#dce4ef;--blue:#173b68;--blue2:#24578e;--accent:#dbeafe;--shadow:0 12px 34px rgba(20,45,80,.08)}
[data-theme="dark"]{--bg:#101722;--surface:#182333;--surface2:#202e40;--text:#e8eef7;--muted:#a7b4c6;--line:#2b3b50;--blue:#9fc5f5;--blue2:#b9d6fb;--accent:#253b56;--shadow:0 12px 34px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}
button,input{font:inherit}button{cursor:pointer}
.topbar{height:70px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.01em;color:var(--blue)}.mark{width:34px;height:34px;border-radius:10px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800}
.actions{display:flex;gap:10px;align-items:center}.ghost,.primary,.navbtn{border:1px solid var(--line);border-radius:10px;padding:8px 13px;background:var(--surface);color:var(--text)}.primary{background:var(--blue);border-color:var(--blue);color:white}
main{max-width:1160px;margin:0 auto;padding:42px 24px 70px}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--blue2);font-weight:750}
h1{font-size:clamp(2rem,4vw,3rem);line-height:1.2;letter-spacing:-.035em;margin:8px 0 12px}.intro{color:var(--muted);max-width:650px;margin:0 0 28px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0 22px}.search{flex:1;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;color:var(--text);outline:none}.search:focus{border-color:var(--blue2);box-shadow:0 0 0 3px var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 24px}.chip{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:7px 13px;color:var(--muted)}.chip.active{background:var(--accent);border-color:var(--blue2);color:var(--blue);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:21px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:220px;transition:transform .18s,border-color .18s}.card:hover{transform:translateY(-3px);border-color:var(--blue2)}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:.76rem;color:var(--blue2);background:var(--accent);padding:4px 9px;border-radius:999px}.pages{font-size:.78rem;color:var(--muted)}.card h2{font-size:1.16rem;line-height:1.4;margin:17px 0 8px}.card p{font-size:.92rem;color:var(--muted);margin:0 0 18px}.open{margin-top:auto;align-self:flex-start;color:var(--blue);font-weight:700;border:0;background:none;padding:0}
.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);background:var(--surface)}
footer{border-top:1px solid var(--line);padding:22px 24px;text-align:center;color:var(--muted);font-size:.82rem}
.reader{display:none;max-width:1100px;margin:0 auto;padding:24px 24px 55px}.reader.active{display:block}.library.hidden{display:none}.reader-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:none;color:var(--blue);font-weight:700;padding:8px 0}.progress-wrap{height:5px;background:var(--surface2);border-radius:9px;overflow:hidden;margin:0 0 24px}.progress{height:100%;width:0;background:var(--blue2);transition:width .2s}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);min-height:min(590px,68vh);padding:clamp(28px,6vw,76px);display:flex;flex-direction:column;justify-content:center}.slide .count{font-size:.82rem;color:var(--blue2);letter-spacing:.1em;font-weight:750}.slide h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:16px 0 24px}.slide ul{padding-left:1.25em;margin:0;max-width:760px}.slide li{font-size:clamp(1.03rem,2vw,1.22rem);margin:13px 0;padding-left:5px}.slide p{font-size:1.1rem;max-width:760px}.slide strong{color:var(--blue2)}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.counter{color:var(--muted);font-variant-numeric:tabular-nums}.navbtn:disabled{opacity:.4;cursor:not-allowed}.notice{font-size:.8rem;color:var(--muted);margin-top:16px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.topbar{height:62px;padding:0 15px}.brand{font-size:.9rem}.grid{grid-template-columns:1fr}main{padding:30px 17px 50px}.reader{padding:17px}.slide{min-height:65vh;padding:28px 22px}.actions .label{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="mark">LW</div><span>LLM Wiki <span style="font-weight:450;opacity:.75">｜生物實驗科普</span></span></div>
  <div class="actions"><button class="ghost" id="themeBtn" aria-label="切換深色模式">☾ <span class="label">深色模式</span></button></div>
</header>
<main class="library" id="library">
  <div class="eyebrow">BIOLOGY LAB KNOWLEDGE BASE</div>
  <h1>生物實驗知識庫</h1>
  <p class="intro">以簡潔的投影片整理常見生物技術，從實驗原理、核心概念到結果判讀，逐步建立基礎知識。三篇文章內容皆直接整合於此 HTML 檔案。</p>
  <div class="toolbar"><input class="search" id="search" type="search" placeholder="搜尋文章標題或關鍵字…" aria-label="搜尋文章"><span id="articleCount" class="pages"></span></div>
  <div class="eyebrow">文章分類</div><div class="filters" id="filters"></div>
  <section class="grid" id="cards" aria-live="polite"></section>
  <p class="notice" id="draftNotice"></p>
</main>
<section class="reader" id="reader">
  <div class="reader-head"><button class="back" id="backBtn">← 返回知識庫</button><button class="ghost" id="readerTheme">☾</button></div>
  <div class="eyebrow" id="readerCategory">BIOLOGY TECHNIQUE</div>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  <article class="slide" id="slide"></article>
  <div class="controls"><button class="navbtn" id="prev">← 上一頁</button><span class="counter" id="counter"></span><button class="primary navbtn" id="next">下一頁 →</button></div>
  <p class="notice">閱讀進度會隨投影片切換更新；此原型不會將閱讀紀錄儲存至帳號。</p>
</section>
<footer>LLM Wiki｜生物實驗科普 · 靜態網站原型</footer>
<script>
// 文章內容直接內嵌於本 HTML，不再透過 fetch 載入 Markdown 或 JSON。
const wikiData = {"categories":[{"id":"molecular-biology","name":"分子生物學"},{"id":"cell-biology","name":"細胞生物學"}],"articles":[{"id":"western-blot","title":"Western blotting｜西方墨點法","description":"認識蛋白質分離、轉漬與抗體偵測的核心概念。","category":"molecular-biology","keywords":["Western blot","蛋白質","抗體","轉漬"],"status":"published","published_version":2,"slides":[{"title":"投影片 1｜什麼是 Western blotting？","bullets":["Western blotting 又稱西方墨點法或蛋白質免疫轉漬法。","這是一種用來偵測樣本中特定蛋白質的分析技術。","可用於觀察蛋白質是否存在，以及比較蛋白質訊號。"]},{"title":"投影片 2｜核心概念","bullets":["**蛋白質分離**：先依蛋白質大小進行電泳分離。","**轉漬**：將分離後的蛋白質轉移到膜上。","**抗體辨識**：利用抗體辨識目標蛋白質，再將訊號顯示出來。"]},{"title":"投影片 3｜電泳分離與轉漬","bullets":["常見方式是 SDS-PAGE，也就是十二烷基硫酸鈉－聚丙烯醯胺凝膠電泳。","SDS 使蛋白質帶有較一致的負電荷，因此可主要依分子大小分離。","分離後的蛋白質會轉移到 PVDF 或硝酸纖維素膜上。"]},{"title":"投影片 4｜抗體如何辨識目標？","bullets":["**抗原（Antigen）**：可被抗體辨識的分子或結構。","**一級抗體（Primary antibody）**：直接辨識目標蛋白質。","**二級抗體（Secondary antibody）**：辨識一級抗體，並協助產生可偵測訊號。"]},{"title":"投影片 5｜訊號如何被看見？","bullets":["二級抗體可搭配不同標記方式。","常見訊號呈現方式包括化學冷光、螢光或呈色反應。","膜上出現的條帶位置與強度，可用來判讀目標蛋白質訊號。"]},{"title":"投影片 6｜結果可以告訴我們什麼？","bullets":["特定位置出現條帶，可作為樣本中存在目標蛋白質的證據。","條帶位置可協助判斷蛋白質的表觀分子量。","條帶強度可用於半定量比較，但仍需適當的對照與分析。"]},{"title":"投影片 7｜常見應用與限制","bullets":["可用於研究蛋白質表現量及蛋白質修飾。","也可用於確認分子選殖後的蛋白質表現。","條帶可能受到抗體專一性、非特異性背景或蛋白質降解等因素影響。"]}],"pages":7},{"id":"rt-qpcr","title":"RT-qPCR｜定量反轉錄即時 PCR","description":"從 RNA 反轉錄到即時螢光監測，理解基因表現分析。","category":"molecular-biology","keywords":["RT-qPCR","RNA","cDNA","qPCR","基因表現"],"status":"published","published_version":2,"slides":[{"title":"投影片 1｜什麼是 RT-qPCR？","bullets":["RT-qPCR 是結合**反轉錄（Reverse transcription）**與**即時定量 PCR（qPCR）**的技術。","常用於分析樣本中特定 RNA 的含量或基因表現。","RT-qPCR 與 RT-PCR、qPCR 並非完全相同的縮寫。"]},{"title":"投影片 2｜先認識兩個步驟","bullets":["**反轉錄**：利用反轉錄酶，將 RNA 轉換成互補 DNA（cDNA）。","**即時定量 PCR**：以 cDNA 作為模板進行 PCR，並在擴增過程中監測螢光訊號。","因此，RT-qPCR 可以把 RNA 資訊轉換成可進行 PCR 分析的 cDNA。"]},{"title":"投影片 3｜即時監測的原理","bullets":["PCR 擴增目標 DNA 時，螢光訊號會隨產物累積而改變。","儀器在每個循環讀取螢光，形成擴增曲線。","螢光訊號達到設定閾值時所對應的循環數，稱為 Cq（Quantification cycle）。"]},{"title":"投影片 4｜兩種常見螢光偵測方式","bullets":["**雙股 DNA 結合染劑**：例如 SYBR Green，會與雙股 DNA 結合並產生螢光。","染劑也可能與非目標的雙股 DNA 產物結合，例如引子二聚體。","**螢光探針法**：使用能辨識特定序列的探針，提供較高的序列辨識專一性。"]},{"title":"投影片 5｜Cq 值代表什麼？","bullets":["Cq 是螢光訊號超過設定閾值時的循環數。","在擴增效率相近且其他條件適當時，起始模板量較多的樣本通常會有較低的 Cq。","Cq 不能脫離反應效率、樣本品質與分析設定單獨解讀。"]},{"title":"投影片 6｜如何比較基因表現？","bullets":["相對定量常將目標基因與參考基因的訊號進行比較。","參考基因也常稱為正規化基因或內參基因。","參考基因在不同樣本與實驗條件下必須維持相對穩定，否則比較可能受到影響。"]},{"title":"投影片 7｜應用與注意事項","bullets":["可用於比較不同樣本中的基因表現。","也可用於核酸檢測、病原體分析及其他分子生物學研究。","RNA 品質、反轉錄效率、引子專一性及擴增效率都會影響結果。"]}],"pages":7},{"id":"mtt-assay","title":"MTT assay｜MTT 細胞活性分析","description":"透過四唑鹽還原與比色訊號，認識細胞代謝活性分析。","category":"cell-biology","keywords":["MTT","細胞活性","formazan","細胞毒性"],"status":"published","published_version":2,"slides":[{"title":"投影片 1｜什麼是 MTT assay？","bullets":["MTT assay 是一種比色分析法（Colorimetric assay）。","常用於評估細胞的代謝活性，並在適當條件下作為活細胞數量的參考。","常見於藥物或化合物的細胞毒性與細胞增殖研究。"]},{"title":"投影片 2｜MTT 是什麼？","bullets":["MTT 的全名為 3-(4,5-dimethylthiazol-2-yl)-2,5-diphenyltetrazolium bromide。","MTT 是一種黃色的四唑鹽染劑。","在細胞還原作用下，MTT 可轉變成紫色、難溶的 formazan（甲䐶）產物。"]},{"title":"投影片 3｜顏色變化代表什麼？","bullets":["MTT 被還原後形成紫色 formazan。","產物經溶解後，可利用分光光度計測量吸光值。","紫色訊號越強，通常代表形成的 formazan 越多。"]},{"title":"投影片 4｜如何讀取結果？","bullets":["吸光值（Absorbance）反映樣本中有色 formazan 的量。","在適當的實驗條件下，吸光值可用來比較不同處理組的細胞代謝活性。","常見測量波長範圍約為 500–600 nm；實際設定依實驗系統而定。"]},{"title":"投影片 5｜MTT assay 的用途","bullets":["可用於評估候選藥物或化學物質對細胞的影響。","可觀察細胞毒性，也可評估細胞增殖受到抑制的情形。","常用於不同處理條件之間的細胞活性比較。"]},{"title":"投影片 6｜解讀時要注意什麼？","bullets":["MTT 訊號反映的是細胞還原 MTT 的能力，與細胞代謝狀態有關。","實驗條件可能改變細胞代謝，卻不一定代表細胞存活數量同步改變。","因此，不宜只憑單一吸光值就直接等同於細胞數或細胞存活率。"]},{"title":"投影片 7｜相關方法","bullets":["XTT、MTS 與 WST 也是相關的四唑鹽比色分析方法。","部分方法可形成水溶性產物，因此不一定需要額外溶解步驟。","不同方法的反應機制與訊號特性並不完全相同，不能直接視為相同實驗。"]}],"pages":7}]};
const preview = false;
let allArticles=wikiData.articles||[], categories=wikiData.categories||[], visibleArticles=[], activeCategory='all', currentSlides=[], currentIndex=0;
const $=id=>document.getElementById(id);
function init(){
  renderFilters();
  renderCards();
}
function renderFilters(){
  const items=[{id:'all',name:'全部分類'},...categories];
  $('filters').innerHTML=items.map(c=>`<button class="chip ${activeCategory===c.id?'active':''}" data-cat="${c.id}">${c.name}</button>`).join('');
  $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderFilters();renderCards();});
}
function renderCards(){
  const q=$('search').value.trim().toLowerCase();
  visibleArticles=allArticles.filter(a=>a.status==='published'&&(activeCategory==='all'||a.category===activeCategory)&&[a.title,a.description,...(a.keywords||[])].join(' ').toLowerCase().includes(q));
  $('articleCount').textContent=`${visibleArticles.length} 篇文章`;
  $('cards').innerHTML=visibleArticles.length?visibleArticles.map(a=>{
    const cat=categories.find(c=>c.id===a.category)?.name||'未分類';
    return `<article class="card"><div class="cardtop"><span class="tag">${cat}</span><span class="pages">${a.pages} 張投影片</span></div><h2>${escapeHtml(a.title)}</h2><p>${escapeHtml(a.description||'')}</p><button class="open" data-id="${a.id}">開始閱讀 →</button></article>`;
  }).join(''):'<div class="empty" style="grid-column:1/-1">目前尚無符合條件的文章。</div>';
  $('cards').querySelectorAll('.open').forEach(b=>b.onclick=()=>openArticle(b.dataset.id));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inlineMd(s){return escapeHtml(s).replace(/\\*\\*(.+?)\\*\\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');}
function openArticle(id){
  const a=allArticles.find(x=>x.id===id); if(!a)return;
  currentSlides=a.slides||[];currentIndex=0;
  $('library').classList.add('hidden');$('reader').classList.add('active');
  $('readerCategory').textContent=(categories.find(c=>c.id===a.category)?.name||'BIOLOGY')+' / '+a.title;
  renderSlide();window.scrollTo(0,0);
}
function renderSlide(){
  const s=currentSlides[currentIndex];
  const body=(s.bullets||[]).map(item=>`<li>${inlineMd(item)}</li>`).join('');
  $('slide').innerHTML=`<div class="count">LLM WIKI · ${String(currentIndex+1).padStart(2,'0')}</div><h1>${escapeHtml(s.title||'')}</h1><ul>${body}</ul>`;
  $('counter').textContent=`${currentIndex+1} / ${currentSlides.length}`;$('progress').style.width=((currentIndex+1)/currentSlides.length*100)+'%';
  $('prev').disabled=currentIndex===0;$('next').disabled=currentIndex===currentSlides.length-1;$('next').textContent=currentIndex===currentSlides.length-1?'已完成':'下一頁 →';
}
function back(){ $('reader').classList.remove('active');$('library').classList.remove('hidden');window.scrollTo(0,0);}
$('search').addEventListener('input',renderCards);$('backBtn').onclick=back;
$('prev').onclick=()=>{if(currentIndex>0){currentIndex--;renderSlide();}};
$('next').onclick=()=>{if(currentIndex<currentSlides.length-1){currentIndex++;renderSlide();}};
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('llmwiki-theme',t);$('themeBtn').innerHTML=t==='dark'?'☀ <span class="label">淺色模式</span>':'☾ <span class="label">深色模式</span>';$('readerTheme').textContent=t==='dark'?'☀':'☾';}
const saved=localStorage.getItem('llmwiki-theme');setTheme(saved||'light');
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}
$('themeBtn').onclick=toggleTheme;$('readerTheme').onclick=toggleTheme;
document.addEventListener('keydown',e=>{if(!$('reader').classList.contains('active'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='Escape')back();});
init();
</script>
</body></html>
